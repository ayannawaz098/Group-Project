<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="form.css">
    <!-- Bootstrap 5.3 CSS Link -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons Link (Required for Sun/Moon icons) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>London to Nepal</title>
</head>
<body>
    <h1 id="h1">London to Nepal</h1>
    <h2 id="r1">Register</h2>
    <form>
        <label>Full Name</label>
        <input type="text" placeholder="Your Name">
        <br>

        <input type="text" placeholder="Email">
        <br>

        <input type="number" placeholder="Contact">
        <br>

        <input type="text" placeholder="City">
        <br>
        <br>

        <input type="number" placeholder="Street Number">
        <br>

        <label>Complete Home Address</label>
        <input type="text" placeholder="Home Address">*Address for Delivery</input>
        <br>
        <br>
        <label>Where do you hear about us ?</label>
        <select id="0" name="city">

        <button id="b1">Submit</button>

      
        

    </form>
    <button id="themeToggleBtn" class="btn btn-outline-dark me-2">
  <i id="themeIcon" class="bi bi-moon-fill"></i>
  <span id="themeText" class="ms-1">Dark Mode</span>
</button>
<script>
  const toggleBtn = document.getElementById('themeToggleBtn');
  const themeIcon = document.getElementById('themeIcon');
  const themeText = document.getElementById('themeText');
  const htmlElement = document.documentElement;

  toggleBtn.addEventListener('click', () => {
    const currentTheme = htmlElement.getAttribute('data-bs-theme');

    if (currentTheme === 'light') {
      // Switch to Dark Theme
      htmlElement.setAttribute('data-bs-theme', 'dark');
      toggleBtn.classList.replace('btn-outline-dark', 'btn-outline-light');
      themeIcon.classList.replace('bi-moon-fill', 'bi-sun-fill');
      themeText.textContent = 'Light Mode';
    } else {
      // Switch to Light Theme
      htmlElement.setAttribute('data-bs-theme', 'light');
      toggleBtn.classList.replace('btn-outline-light', 'btn-outline-dark');
      themeIcon.classList.replace('bi-sun-fill', 'bi-moon-fill');
      themeText.textContent = 'Dark Mode';
    }
  });
</script>
    
</body>
</html>
