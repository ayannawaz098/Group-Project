    <button id="themeToggleBtn" class="btn btn-outline-dark me-2">
  <i id="themeIcon" class="bi bi-moon-fill"></i>
  <span id="themeText" class="ms-1">Dark Mode</span>
</button>
<script>
  const toggleBtn = document.getElementById('themeToggleBtn');
  const themeIcon = document.getElementById('themeIcon');
  const themeText = document.getElementById('themeText');
  const htmlElement = document.documentElement;

  toggleBtn.addEventListener('click', () => {
    const currentTheme = htmlElement.getAttribute('data-bs-theme');

    if (currentTheme === 'light') {
      // Switch to Dark Theme
      htmlElement.setAttribute('data-bs-theme', 'dark');
      toggleBtn.classList.replace('btn-outline-dark', 'btn-outline-light');
      themeIcon.classList.replace('bi-moon-fill', 'bi-sun-fill');
      themeText.textContent = 'Light Mode';
    } else {
      // Switch to Light Theme
      htmlElement.setAttribute('data-bs-theme', 'light');
      toggleBtn.classList.replace('btn-outline-light', 'btn-outline-dark');
      themeIcon.classList.replace('bi-sun-fill', 'bi-moon-fill');
      themeText.textContent = 'Dark Mode';
    }
  });
</script>
</div>
    <script >
const registrationForm = document.querySelector('form');

registrationForm.addEventListener('submit', function (event) {
    event.preventDefault();

    const inputs = registrationForm.querySelectorAll('input');
    const fullName = inputs[0].value.trim();
    const email = inputs[1].value.trim();

    if (fullName === "") {
        alert("Please enter your Full Name.");
        return;
    }

    if (email === "") {
        alert("Please enter your Email Address.");
        return;
    }
    const emailPattern = /\w+@\w+/;
    if (emailPattern.test(email) === false) {
        alert("Please enter a valid email address.");
        return;
    }

    alert("Thank you, " + fullName + "! Your form has been submitted successfully.");



});</script>
