<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .checkout {
            width: 400px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            font-size: 18px;
        }

        .total {
            border-top: 2px solid #ddd;
            padding-top: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        #country {
            font-weight: bold;
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: #022417;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div class="checkout">

        <h1>Checkout</h1>

        <div class="row">
            <span>Delivery Country:</span>
            <span id="country">Loading...</span>
        </div>

        <div class="row">
            <span>Original Total:</span>
            <span>£100.00</span>
        </div>

        <div class="row total">
            <span>Total:</span>
            <span id="convertedTotal">Loading...</span>
        </div>

        <button onclick="placeOrder()">
            Place Order
        </button>

    </div>


    <script>

        let countryInfo = JSON.parse(localStorage.getItem("country") || "{}");

        let lat = parseFloat(countryInfo.latitude);
        let lng = parseFloat(countryInfo.longitude);

        let totalGBP = 100.00;

        let countries = [

            {
                name: "Nepal",

                minLat: 26.347,
                maxLat: 30.447,

                minLng: 80.058,
                maxLng: 88.202,

                currency: {
                    code: "NPR",
                    symbol: "रू",
                    rate: 209
                }
            },

            {
                name: "Bangladesh",

                minLat: 20.738,
                maxLat: 26.634,

                minLng: 88.028,
                maxLng: 92.673,

                currency: {
                    code: "BDT",
                    symbol: "৳",
                    rate: 148
                }
            },

            {
                name: "Pakistan",

                minLat: 23.634,
                maxLat: 37.097,

                minLng: 60.872,
                maxLng: 77.837,

                currency: {
                    code: "PKR",
                    symbol: "₨",
                    rate: 380
                }
            },

            {
                name: "Sri Lanka",

                minLat: 5.916,
                maxLat: 9.835,

                minLng: 79.652,
                maxLng: 81.879,

                currency: {
                    code: "LKR",
                    symbol: "Rs",
                    rate: 400
                }
            },

            {
                name: "India",

                minLat: 6.554,
                maxLat: 35.674,

                minLng: 68.111,
                maxLng: 97.395,

                currency: {
                    code: "INR",
                    symbol: "₹",
                    rate: 112
                }
            }

        ];


        function getCountryByCoordinates(lat, lng) {

            return countries.find(country =>
                lat >= country.minLat &&
                lat <= country.maxLat &&
                lng >= country.minLng &&
                lng <= country.maxLng
            );
        }


        function convertCurrency() {

            if (isNaN(lat) || isNaN(lng)) {
                document.getElementById("convertedTotal").innerHTML =
                    "£ " + totalGBP.toFixed(2);
                return;
            }

            let country = getCountryByCoordinates(lat, lng);

            if (country) {

                let currency = country.currency;

                let convertedPrice = totalGBP * currency.rate;

                document.getElementById("convertedTotal").innerHTML =
                    currency.symbol + " " +
                    convertedPrice.toFixed(2)
                
                console.log("Country:", country.name);

                document.getElementById("country").innerHTML = country.name;

                
                console.log("Currency:", currency.code);

            } else {

                document.getElementById("convertedTotal").innerHTML =
                    "£ " + totalGBP.toFixed(2);
            }
        }




        convertCurrency();




        function placeOrder() {

            alert(
                "Order placed successfully!\n" +
                "Country: " + country.name
            );

        }

    </script>

</body>

</html>
