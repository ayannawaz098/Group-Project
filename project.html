<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shop</title>

<link rel="stylesheet" href="style.css">
<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
   
    text-align:center;
        margin:0;
    font-family:Arial, sans-serif;

    background-image: url("bb.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    
}

h1{
    margin-top:30px;
}

p{
    color:#555;
    margin-bottom:40px;
}

.container{
    display:flex;
    justify-content:center;
    gap:40px;
    flex-wrap:wrap;
}

.button{
    width:300px;
    height:420px;
    border:none;
    border-radius:20px;
    color:white;
    font-size:30px;
    font-weight:bold;
    cursor:pointer;

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;

    text-shadow:2px 2px 5px black;

    transition:0.3s;
}

.button:hover{
    transform:translateY(-10px);
    box-shadow:0 12px 25px rgba(0,0,0,.3);
}

.button1{
    background-image:url("https://images.pexels.com/photos/12210270/pexels-photo-12210270.jpeg");
}

.button2{
    background-image:url("https://images.pexels.com/photos/4202325/pexels-photo-4202325.jpeg");
}

.button3{
    background-image:url("https://images.pexels.com/photos/14440412/pexels-photo-14440412.jpeg");
}


</style>
</head>

<body>

<h1>Shop From London</h1>
<p>London to Your Home</p>

<div class="container">

<a href="shoes.html"><button class="button button1">Shoes</button></a>

<a href="Acessories.html"><button class="button button2">Acessories</button></a>

</div>


</body>
</html>
