<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>button pt1</title>
  <style>
    .button {
      color: white;
      padding: 250px 150px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      margin: 100px 100px 100px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .button:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    .button1 {
      background-image: url(https://images.pexels.com/photos/12210270/pexels-photo-12210270.jpeg);
      background-repeat: no-repeat;
      background-size: 100% 100%;
    }

    .button2 {
      background-image: url(https://images.pexels.com/photos/4202325/pexels-photo-4202325.jpeg);
      background-repeat: no-repeat;
      background-size: 100% 100%;
    }

    .button3 {
      background-image: url(https://images.pexels.com/photos/6660060/pexels-photo-6660060.jpeg);
      background-repeat: no-repeat;
      background-size: 100% 100%;
    }
  </style>
</head>

<body>

  <h1>The button element</h1>
  <p>prototype</p>

  <button class="button button1">one </button>
  <button class="button button2">two </button>
  <button class="button button3">three</button>

</body>

</html>
