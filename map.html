<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Delivery Location</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    text-align:center;
    background:#f4f4f4;
}

h2{
    margin:20px;
}

#map{
    height:500px;
    width:90%;
    margin:auto;
    border:2px solid #333;
    border-radius:10px;
}

#location{
    margin:20px;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<h2>Select Your Delivery Location</h2>

<div id="map"></div>

<p id="location">
Move the pin to your country.
</p>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// Create map
var map = L.map('map').setView([28.3949,84.1240],5);

// Load OpenStreetMap
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    subdomains: 'abcd',
    maxZoom: 20
}).addTo(map);

// Add draggable marker
var marker = L.marker([28.3949,84.1240],{
    draggable:true
}).addTo(map);

// Show coordinates when pin moves
marker.on('dragend',function(){

    var pos = marker.getLatLng();

    document.getElementById("location").innerHTML =
    "Latitude: " + pos.lat.toFixed(5) +
    "<br>Longitude: " + pos.lng.toFixed(5);

});
</script>

</body>
</html>
